<!doctype html>
<html lang="en" data-sketchor-auto>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sketchor-view auto-upgrade demo</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0e0f12; color: #e6e8ec; }
      main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
      a { color: #8fb0ff; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      sketchor-view { width: 100%; }
    </style>
    <!-- On a real page: <script type="module" src=".../sketchor-embed.js" data-auto></script> -->
    <script type="module" src="./src/index.ts"></script>
  </head>
  <body>
    <main>
      <h1>Auto-upgrade</h1>
      <p>Plain links and images marked with <code>data-sketchor</code> become previews.</p>
      <div class="grid">
        <a href="/demo-local/PRT-11742.glb" data-sketchor data-sketchor-autoplay>Part PRT-11742</a>
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-sketchor-src="/demo-local/ASM-4019.glb" alt="Assembly ASM-4019" />
        <a href="/files/plate.step" data-sketchor>Plate (STEP)</a>
        <a href="/files/notes.docx" data-sketchor>Notes (stays a link)</a>
      </div>
      <p id="late"></p>
    </main>
    <script type="module">
      // Added after load: the MutationObserver should upgrade it too.
      setTimeout(() => {
        document.getElementById("late").innerHTML = '<a href="/demo-local/shokeychain.glb" data-sketchor data-sketchor-motion="none">Keychain (added later)</a>';
      }, 800);
    </script>
  </body>
</html>
