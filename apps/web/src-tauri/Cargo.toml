[package]
name = "sketchor"
version = "0.33.1"
license = "AGPL-3.0-or-later"
description = "Sketchor - modern parametric 2D sketching"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# Opens the release notes / download page from the update panel.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Signed in-app updates: `updater` downloads and verifies the NSIS installer,
# `process` relaunches Sketchor once it has been applied.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
