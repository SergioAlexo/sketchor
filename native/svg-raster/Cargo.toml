[package]
name = "svg-raster"
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2021"
description = "SVG -> RGBA thumbnail rasteriser (resvg) for Sketchor's Windows Explorer thumbnailer"

[lib]
crate-type = ["rlib"]

[features]
# Off by default: SVG text needs the system fonts loaded (slow inside Explorer)
# and ~1.3 MB of shaping code, for labels a thumbnail barely shows.
default = []
# SVG text drawn with the system's fonts.
text = ["resvg/text", "resvg/system-fonts", "resvg/memmap-fonts"]

[dependencies]
# Apache-2.0 OR MIT; recorded in NOTICE.md. Embedded PNGs decode without
# `raster-images` (which only adds GIF/WebP/JPEG); left off to keep the DLL small.
resvg = { version = "0.50", default-features = false }

[dev-dependencies]
png = "0.17"
